[package]
name = "battray"
version = "0.4.2"
edition = "2024"
description = "Lightweight Windows tray app that shows the battery level of wireless mice, keyboards and controllers"
repository = "https://github.com/forkacper/battray"
readme = "README.md"
keywords = ["battery", "tray", "logitech", "dualsense", "keychron"]
categories = ["hardware-support", "os::windows-apis"]
license = "MIT"

[build-dependencies]
embed-resource = "3.0.12"

[dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
undocumented_unsafe_blocks = "warn"
