name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - uses: actions/upload-artifact@v7
        with:
          name: battray
          path: target/release/battray.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        # The firmware workflow may have created the release already.
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" target/release/battray.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
