name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Check version flag
        shell: bash
        run: test "$(target/release/battray.exe --version)" = "battray $(cargo pkgid | sed 's/.*[#@]//')"

      - uses: actions/upload-artifact@v7
        with:
          name: battray
          path: target/release/battray.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        # The firmware workflow may have created the release already, so the notes
        # are always set from the changelog afterwards.
        run: |
          tag="${{ github.ref_name }}"
          awk -v v="${tag#v}" '$0 ~ "^## \\[" v "\\]" { f = 1; next } /^## \[/ { f = 0 } f' CHANGELOG.md > notes.md
          printf '\nDownload `battray.exe` below and run it. See the [README](https://github.com/forkacper/battray#readme) for details.\n' >> notes.md
          gh release create "$tag" --title "battray $tag" --notes-file notes.md || true
          gh release edit "$tag" --title "battray $tag" --notes-file notes.md
          gh release upload "$tag" target/release/battray.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update Scoop manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          hash=$(sha256sum target/release/battray.exe | cut -d' ' -f1)
          git fetch origin main
          git checkout -B main origin/main
          sed -i -E \
            -e "s|(\"version\": \")[^\"]*|\\1$version|" \
            -e "s|(releases/download/v)[^/]*(/battray.exe\",)|\\1$version\\2|" \
            -e "s|(\"hash\": \")[^\"]*|\\1$hash|" \
            bucket/battray.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update Scoop manifest to $version" || exit 0
          git push origin main
