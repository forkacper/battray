name: Firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  boards:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.list.outputs.boards }}
    steps:
      - uses: actions/checkout@v7

      - id: list
        name: List Keychron wireless boards
        run: echo "boards=$(sh firmware/keychron/build.sh --list)" >> "$GITHUB_OUTPUT"
        env:
          WORK: /tmp/keychron

  keychron:
    needs: boards
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.boards.outputs.boards) }}
    steps:
      - uses: actions/checkout@v7

      - name: Build firmware
        run: sh firmware/keychron/build.sh "${{ matrix.board }}"
        env:
          WORK: /tmp/keychron

      - uses: actions/upload-artifact@v7
        with:
          name: keychron-${{ matrix.board }}
          path: firmware/keychron/out/*

  release:
    # Publish whatever built, even if a few boards failed.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: keychron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: keychron-*
          merge-multiple: true
          path: keychron

      # The app workflow may have created the release already.
      - name: Attach to release
        run: |
          if ls keychron/skipped-*.txt >/dev/null 2>&1; then
            cat keychron/skipped-*.txt > keychron/SKIPPED.txt
            rm keychron/skipped-*.txt
          fi
          (cd keychron && zip -q ../keychron-battray-firmware.zip *)
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" keychron-battray-firmware.zip --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
