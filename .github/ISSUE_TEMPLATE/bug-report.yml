name: Bug report
description: Something in battray itself does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: battray version
      description: Shown in the first line of the diagnostics report, e.g. 0.2.0.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: e.g. Windows 11 24H2.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Relevant lines from %APPDATA%\battray\battray.log.
      render: text
